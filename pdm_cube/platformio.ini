[platformio]
default_envs = stm32f446_cube
src_dir = src

[env:stm32f446_cube]
platform = ststm32@20.0.0
board = genericSTM32F446ZET6
framework = stm32cube
build_flags =
    -DPDM_CUBE_EXPERIMENTAL=1
    -DUSE_HAL_DRIVER
    -DSTM32F446xx
    -std=gnu11
    -Wall
    -Wextra
    -Werror=implicit-function-declaration
    -ffunction-sections
    -fdata-sections
monitor_speed = 115200
