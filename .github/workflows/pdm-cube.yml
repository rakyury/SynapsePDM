name: STM32Cube PDM firmware (experimental)

on:
  push:
    branches: [feature/stm32cube-pdm]
    paths:
      - 'pdm_cube/**'
      - '.github/workflows/pdm-cube.yml'
  pull_request:
    paths:
      - 'pdm_cube/**'
      - '.github/workflows/pdm-cube.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r2-core-host:
    name: R2 VM and channel engine host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run with address/UB sanitizers
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            pdm_cube/tests/test_r2_core.c \
            pdm_cube/src/r2_shared/channel_engine/channel.c \
            pdm_cube/src/r2_shared/channel_engine/stateful_nodes.c \
            pdm_cube/src/r2_shared/vm/vm.c \
            pdm_cube/src/r2_shared/filters/filter.c \
            pdm_cube/src/r2_shared/timers/timer.c \
            pdm_cube/src/r2_shared/tables/table.c \
            pdm_cube/src/r2_shared/can_tx/can_tx.c \
            -o /tmp/pdm_r2_core_test
          /tmp/pdm_r2_core_test

  cube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install 'platformio==6.1.18'
      - name: Compile STM32Cube firmware
        run: python -m platformio run -d pdm_cube -e stm32f446_cube
      - name: Upload experimental Cube firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pdm-cube-experimental-DO-NOT-FLASH
          path: |
            pdm_cube/.pio/build/stm32f446_cube/*.elf
            pdm_cube/.pio/build/stm32f446_cube/*.bin
          if-no-files-found: error
